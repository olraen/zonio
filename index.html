<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>

    <title>Zonio</title>
  </head>
  <body>
    <!-- Main app -->
    <div class="app">
      <header class="header">
        <h1>🌎 World Clock</h1>
        <p>Track time across the globe</p>
      </header>

      <!-- Add city  -->
      <section class="search-section">
        <select name="" id="city-select">
          <option value="">Add a city...</option>
          <option value="">Los Angeles</option>
          <option value="">Paris</option>
          <option value="">Tokyo</option>
          <option value="">Berlin</option>
          <option value="">Sydney</option>
        </select>
      </section>

      <!-- Clock Cards -->
      <section class="clock-container">
        <!-- Single Card -->
        <div class="clock-card" id="los-angeles">
          <button class="remove-btn">×</button>

          <h2>Los Angeles</h2>
          <p class="country">USA</p>

          <div class="time"></div>

          <p class="date"></p>

          <span class="time-period"></span>
        </div>

        <!-- Another Card -->
        <div class="clock-card" id="paris">
          <button class="remove-btn">×</button>

          <h2>Paris</h2>
          <p class="country">France</p>

          <div class="time"></div>

          <p class="date"></p>

          <span class="time-period">Afternoon</span>
        </div>
      </section>

      <!-- Footer -->
      <footer>
        This project was coded by
        <a
          href="https://github.com/olraen"
          target="_blank"
          rel="noopener noreferrer"
          >Olraen</a
        >
        and is hosted on
        <a href="https://github.com/olraen/zonio" target="_blank"> GitHub</a>
      </footer>
    </div>
  </body>
  <script src="javascript/index.js"></script>
</html>
