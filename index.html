<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="png" href="image/favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>

    <title>Zonio</title>
  </head>
  <body>
    <!-- Main app -->
    <div class="app">
      <header class="header">
        <h1>🌎 World Clock</h1>
        <p>Track time across the globe</p>
      </header>

      <!-- Add city  -->
      <section class="search-section">
        <select name="" id="city-select">
          <option value="">Add a city...</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="America/Chicago">Chicago</option>
          <option value="America/New_York">New York</option>
          <option value="Europe/London">London</option>
          <option value="Europe/Athens">Athens</option>
          <option value="Asia/Dubai">Dubai</option>
          <option value="Asia/Kolkata">Mumbai</option>
          <option value="Asia/Singapore">Singapore</option>
          <option value="Asia/Tokyo">Tokyo</option>
          <option value="Australia/Sydney">Sydney</option>
        </select>
      </section>

      <!-- Clock Cards -->
      <section class="clock-container"></section>

      <!-- Footer -->
      <footer>
        This project was coded by
        <a
          href="https://github.com/olraen"
          target="_blank"
          rel="noopener noreferrer"
          >Olraen</a
        >
        and is hosted on
        <a href="https://github.com/olraen/zonio" target="_blank"> GitHub</a>
      </footer>
    </div>
  </body>
  <script src="javascript/index.js"></script>
</html>
